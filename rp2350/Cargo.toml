[package]
name = "rp2350"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hardware Abstraction Layer for RP2350 microcontrollers"
readme = "README.md"
repository.workspace = true
keywords = ["rp2350", "hal", "embedded", "cortex-m", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]
# The crate-local `.cargo/config.toml` only picks the default build target for
# this repository; it must not ship in the published package.
exclude = [".cargo"]

[dependencies]
defmt = { workspace = true, optional = true }
pastey.workspace = true
rp2350-macro.workspace = true
rp2350-rt.workspace = true
rp2350-pac.workspace = true
critical-section.workspace = true

[features]
default = ["defmt", "rp2350a", "critical-section-impl", "panic-handler"]
defmt = ["dep:defmt"]
# RP2350 chip variant selection (mutually exclusive)
rp2350a = []  # RP2350A: 30 GPIO pins (0-29), default
rp2350b = []  # RP2350B: 48 GPIO pins (0-47)
# Register this crate as the critical-section implementation provider.
critical-section-impl = []
panic-handler = []
# Copy .text and .rodata to RAM at startup so all code runs from RAM.
run-from-ram = ["rp2350-rt/run-from-ram"]
# Optional second stage boot loader (XIP setup). Off by default: RP2350 boots
# without it, it only speeds up XIP. `boot2` is the bare switch, each
# `boot2-<part>` feature selects the flash part and implies it.
boot2 = ["rp2350-rt/boot2"]
boot2-w25q80 = ["rp2350-rt/boot2-w25q80"]
boot2-generic-03h = ["rp2350-rt/boot2-generic-03h"]

[package.metadata.docs.rs]
features = ["defmt"]
targets = ["thumbv8m.main-none-eabihf"]

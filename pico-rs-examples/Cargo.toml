[package]
name = "pico-rs-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Examples for pico-rs"
autobins = false

[features]
default = []
rp2350b = ["pico-rs/rp2350b"]

[dependencies]
pico-rs.workspace = true
pico-rs-usb.workspace = true
pico-rs-rt.workspace = true
defmt.workspace = true
defmt-rtt.workspace = true
panic-probe.workspace = true

[[bin]]
name = "blink"
path = "src/bin/blink.rs"

[[bin]]
name = "sht3x"
path = "src/bin/i2c/sht3x.rs"

[[bin]]
name = "dormant"
path = "src/bin/clocks/dormant.rs"

[[bin]]
name = "reset_demo"
path = "src/bin/reset_demo.rs"

[[bin]]
name = "sio_example"
path = "src/bin/sio_example.rs"

[[bin]]
name = "gpio_example"
path = "src/bin/gpio_example.rs"

[[bin]]
name = "timer_interrupt"
path = "src/bin/timer_interrupt.rs"

[[bin]]
name = "clock_config"
path = "src/bin/clock_config.rs"

[[bin]]
name = "adc_example"
path = "src/bin/adc_example.rs"

[[bin]]
name = "usb_cdc_acm"
path = "src/bin/usb_cdc_acm.rs"

[[bin]]
name = "usb_cdc_acm_interrupt"
path = "src/bin/usb_cdc_acm_interrupt.rs"

[[bin]]
name = "gpio_interrupt"
path = "src/bin/gpio_interrupt.rs"

[package]
name = "pico-rs-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Examples for pico-rs"
autobins = false

[features]
default = []
rp2350b = ["pico-rs/rp2350b"]

[dependencies]
pico-rs.workspace = true
pico-rs-usb.workspace = true
pico-rs-rt.workspace = true
defmt.workspace = true
defmt-rtt.workspace = true
panic-probe.workspace = true

[[bin]]
name = "blink"
path = "src/bin/blink.rs"

[[bin]]
name = "sht3x"
path = "src/bin/i2c/sht3x.rs"

[[bin]]
name = "dormant"
path = "src/bin/clocks/dormant.rs"

[[bin]]
name = "multicore"
path = "src/bin/multicore.rs"

[[bin]]
name = "pio_blink"
path = "src/bin/pio/pio_blink.rs"

[[bin]]
name = "pio_blink_advanced"
path = "src/bin/pio/pio_blink_advanced.rs"

[[bin]]
name = "reset_demo"
path = "src/bin/reset_demo.rs"

[[bin]]
name = "sio_example"
path = "src/bin/sio_example.rs"

[[bin]]
name = "gpio_example"
path = "src/bin/gpio/gpio_example.rs"

[[bin]]
name = "gpio_interrupt"
path = "src/bin/gpio/gpio_interrupt.rs"

[[bin]]
name = "timer_interrupt"
path = "src/bin/timer_interrupt.rs"

[[bin]]

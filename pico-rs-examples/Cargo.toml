[package]
name = "pico-rs-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Examples for pico-rs"
autobins = false

[features]
default = []
rp2350b = ["pico-rs/rp2350b"]

[dependencies]
pico-rs.workspace = true
pico-rs-usb.workspace = true
pico-rs-rt.workspace = true
defmt.workspace = true
defmt-rtt.workspace = true
panic-probe.workspace = true


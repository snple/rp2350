[package]
name = "rp2350-usb"
version = "0.1.1"
edition.workspace = true
license.workspace = true
description = "USB Device Stack for RP2350 microcontrollers"
repository.workspace = true
readme = "README.md"
keywords = ["rp2350", "usb", "embedded", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
defmt = { workspace = true, optional = true }
usb-stack.workspace = true
rp2350-pac.workspace = true
rp2350-rt.workspace = true

[features]
default = ["defmt"]
defmt = ["dep:defmt", "usb-stack/defmt"]

[package.metadata.docs.rs]
features = ["defmt"]
targets = ["thumbv8m.main-none-eabihf"]

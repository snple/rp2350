[package]
name = "pico-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hardware Abstraction Layer for RP2350 microcontrollers"

[dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
critical-section = { workspace = true, optional = true }
portable-atomic = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
cfg-if.workspace = true
paste = "1.0"
pico-rs-macro.workspace = true
pico-rs-pac = { path = "../pico-rs-pac", features = ["cortex-m"] }
enumflags2 = "0.7"

[features]
default = ["rt", "critical-section", "atomics", "defmt", "rp2350a"]
rt = ["cortex-m-rt/device", "pico-rs-pac/rt"]
# 注意: 不使用 cortex-m/critical-section-single-core，因为 RP2350 是双核 CPU
# 我们使用硬件 spinlock 实现多核安全的 critical-section
critical-section = ["dep:critical-section", "critical-section/restore-state-u32", "pico-rs-pac/critical-section"]
atomics = ["dep:portable-atomic"]
defmt = ["dep:defmt"]
# RP2350 chip variant selection (mutually exclusive)
rp2350a = []  # RP2350A: 30 GPIO pins (0-29), default
rp2350b = []  # RP2350B: 48 GPIO pins (0-47)

[package.metadata.docs.rs]
features = ["rt", "critical-section", "defmt"]
targets = ["thumbv8m.main-none-eabihf"]

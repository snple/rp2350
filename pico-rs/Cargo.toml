[package]
name = "pico-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hardware Abstraction Layer for RP2350 microcontrollers"

[dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
critical-section = { workspace = true, optional = true }
portable-atomic = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
vcell.workspace = true
cfg-if.workspace = true
pico-rs-macro.workspace = true

[features]
default = ["rt", "critical-section", "atomics", "defmt"]
rt = ["cortex-m-rt/device"]
critical-section = ["dep:critical-section", "cortex-m/critical-section-single-core"]
atomics = ["dep:portable-atomic"]
defmt = ["dep:defmt"]

[package.metadata.docs.rs]
features = ["rt", "critical-section", "defmt"]
targets = ["thumbv8m.main-none-eabihf"]

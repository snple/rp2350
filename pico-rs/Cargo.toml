[package]
name = "pico-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hardware Abstraction Layer for RP2350 microcontrollers"
readme = "README.md"

[dependencies]
defmt = { workspace = true, optional = true }
paste.workspace = true
pico-rs-macro.workspace = true
pico-rs-rt.workspace = true
pico-rs-pac.workspace = true
critical-section.workspace = true

[features]
default = ["defmt", "rp2350a", "critical-section-impl", "panic-handler"]
defmt = ["dep:defmt"]
# RP2350 chip variant selection (mutually exclusive)
rp2350a = []  # RP2350A: 30 GPIO pins (0-29), default
rp2350b = []  # RP2350B: 48 GPIO pins (0-47)
# Security mode selection
non-secure = []  # Use SIO_NS (0xd002_0000) instead of SIO (0xd000_0000)
# Register this crate as the critical-section implementation provider.
critical-section-impl = []
panic-handler = []

[package.metadata.docs.rs]
features = ["defmt"]
targets = ["thumbv8m.main-none-eabihf"]

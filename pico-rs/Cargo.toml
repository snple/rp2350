[package]
name = "pico-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hardware Abstraction Layer for RP2350 microcontrollers"

[dependencies]
portable-atomic = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
cfg-if.workspace = true
paste = "1.0"
pico-rs-macro.workspace = true
pico-rs-rt.workspace = true
pico-rs-pac.workspace = true
enumflags2 = "0.7"

[features]
default = ["rt", "atomics", "defmt", "rp2350a"]
rt = ["pico-rs-rt/rt", "pico-rs-pac/rt"]
atomics = ["dep:portable-atomic"]
defmt = ["dep:defmt"]
# RP2350 chip variant selection (mutually exclusive)
rp2350a = []  # RP2350A: 30 GPIO pins (0-29), default
rp2350b = []  # RP2350B: 48 GPIO pins (0-47)

[package.metadata.docs.rs]
features = ["rt", "defmt"]
targets = ["thumbv8m.main-none-eabihf"]

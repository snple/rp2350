[workspace]
resolver = "2"
members = [
    "pico-rs",
    "pico-rs-pac",
    "pico-rs-macro",
    "pico-rs-usb",
    "pico-rs-rt",
    "pico-rs-examples",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/pico-rs"

[workspace.dependencies]
cfg-if = "1.0"

# Logging
defmt = "1.0.1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

# Macros
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

# Local crates
pico-rs = { path = "pico-rs" }
pico-rs-rt = { path = "pico-rs-rt" }
pico-rs-pac = { path = "pico-rs-pac" }
pico-rs-macro = { path = "pico-rs-macro" }
pico-rs-usb = { path = "pico-rs-usb" }

critical-section = { version = "1.2", features = ["restore-state-u32"]}

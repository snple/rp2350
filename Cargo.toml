[workspace]
resolver = "2"
members = [
    "pico-rs",
    "pico-rs-pac",
    "pico-rs-macro",
    "pico-rs-drivers",
    "pico-rs-usb",
    "pico-rs-rt",
    "pico-rs-examples",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/pico-rs"

[workspace.dependencies]
# Logging
defmt = "1.1"
defmt-rtt = "1.2"

# Macros / code generation
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
bitfield-struct = "0.12"

# Local crates
pico-rs = { path = "pico-rs" }
pico-rs-rt = { path = "pico-rs-rt" }
pico-rs-pac = { path = "pico-rs-pac" }
pico-rs-macro = { path = "pico-rs-macro" }
pico-rs-drivers = { path = "pico-rs-drivers" }
pico-rs-usb = { path = "pico-rs-usb" }

critical-section = { version = "1.2", features = ["restore-state-u32"]}

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"

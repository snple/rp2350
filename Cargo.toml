[workspace]
resolver = "2"
members = [
    "xtask",
    "pico-rs",
    "pico-rs-pac",
    "pico-rs-macro",
    "pico-rs-drivers",
    "pico-rs-usb",
    "pico-rs-rt",
    "pico-rs-examples",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://codeup.aliyun.com/63d3a3275a9c65204d960712/pico-rs.git"

[workspace.dependencies]
# Logging
defmt = "1.1"
defmt-rtt = "1.2"

# Macros / code generation
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }
paste = "1.0"
bitfield-struct = "0.13"
enumflags2 = "0.7"

# Local crates
pico-rs = { path = "pico-rs" }
pico-rs-rt = { path = "pico-rs-rt" }
pico-rs-pac = { path = "pico-rs-pac" }
pico-rs-macro = { path = "pico-rs-macro" }
pico-rs-drivers = { path = "pico-rs-drivers" }
pico-rs-usb = { path = "pico-rs-usb" }

critical-section = { version = "1.2", features = ["restore-state-u32"]}

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
debug = 2

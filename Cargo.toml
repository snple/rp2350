[workspace]
resolver = "2"
members = [
    "xtask",
    "rp2350",
    "rp2350-pac",
    "rp2350-macro",
    "rp2350-drivers",
    "rp2350-usb",
    "rp2350-rt",
    "rp2350-boot2",
    "rp2350-examples",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/snple/rp2350.git"

[workspace.dependencies]
# Logging
defmt = "1.2"
defmt-rtt = "1.3.1"

# Macros / code generation
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }
pastey = "0.2"
bitfield-struct = "0.13"

# Local crates
# rp2350 and rp2350-drivers default to no features at the workspace level;
# each consumer (drivers/examples) explicitly forwards the chip variant and
# other features it needs so `rp2350a` and `rp2350b` can never both be enabled.
#
# The `version` next to each `path` is required by `cargo publish`: it becomes
# the crates.io requirement in the published manifest (the `path` is dropped),
# so it must be bumped together with the release version.
rp2350 = { version = "0.1.0", path = "rp2350", default-features = false }
rp2350-rt = { version = "0.1.0", path = "rp2350-rt" }
# No default features: the flash-chip variant is selected explicitly by the
# consumer (`rp2350-rt`'s `boot2-w25q80` / `boot2-generic-03h` features).
rp2350-boot2 = { version = "0.1.0", path = "rp2350-boot2", default-features = false }
rp2350-pac = { version = "0.1.0", path = "rp2350-pac" }
rp2350-macro = { version = "0.1.0", path = "rp2350-macro" }
rp2350-drivers = { version = "0.1.0", path = "rp2350-drivers", default-features = false }
rp2350-usb = { version = "0.1.0", path = "rp2350-usb", default-features = false }

critical-section = { version = "1.2", features = ["restore-state-u32"]}

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
debug = 2

[workspace]
resolver = "2"
members = [
    "roschi",
    "roschi-pac",
    "roschi-macro",
    "roschi-drivers",
    "roschi-usb",
    "roschi-rt",
    "roschi-examples",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/roschi"

[workspace.dependencies]
# Logging
defmt = "1.1"
defmt-rtt = "1.2"

# Macros
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

# Local crates
roschi = { path = "roschi" }
roschi-rt = { path = "roschi-rt" }
roschi-pac = { path = "roschi-pac" }
roschi-macro = { path = "roschi-macro" }
roschi-drivers = { path = "roschi-drivers" }
roschi-usb = { path = "roschi-usb" }

critical-section = { version = "1.2", features = ["restore-state-u32"]}

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"

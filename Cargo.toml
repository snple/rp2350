[workspace]
resolver = "2"
members = [
    "xtask",
    "rp2350",
    "rp2350-pac",
    "rp2350-macro",
    "rp2350-drivers",
    "rp2350-usb",
    "rp2350-rt",
    "rp2350-boot2",
    "rp2350-examples",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://codeup.aliyun.com/63d3a3275a9c65204d960712/rp2350.git"

[workspace.dependencies]
# Logging
defmt = "1.1"
defmt-rtt = "1.3"

# Macros / code generation
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }
pastey = "0.2"
bitfield-struct = "0.13"
enumflags2 = "0.7"

# Local crates
# rp2350 and rp2350-drivers default to no features at the workspace level;
# each consumer (drivers/examples) explicitly forwards the chip variant and
# other features it needs so `rp2350a` and `rp2350b` can never both be enabled.
rp2350 = { path = "rp2350", default-features = false }
rp2350-rt = { path = "rp2350-rt" }
# No default features: the flash-chip variant is selected explicitly by the
# consumer (`rp2350-rt`'s `boot2-w25q80` / `boot2-generic-03h` features).
rp2350-boot2 = { path = "rp2350-boot2", default-features = false }
rp2350-pac = { path = "rp2350-pac" }
rp2350-macro = { path = "rp2350-macro" }
rp2350-drivers = { path = "rp2350-drivers", default-features = false }
rp2350-usb = { path = "rp2350-usb" }

critical-section = { version = "1.2", features = ["restore-state-u32"]}

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
debug = 2

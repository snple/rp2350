[workspace]
resolver = "2"
members = [
    "pico-rs",
    "pico-rs-macro",
    "pico-rs-examples",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/pico-rs"

[workspace.dependencies]
# RP2350 dependencies
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
critical-section = "1.2"
portable-atomic = { version = "1.11", default-features = false }
vcell = "0.1.3"
cfg-if = "1.0"

# Logging
defmt = "1.0.1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

# Macros
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

# Local crates
pico-rs = { path = "pico-rs" }
pico-rs-macro = { path = "pico-rs-macro" }

[target.thumbv8m.main-none-eabihf]
# Choose a default "cargo run" tool (see README for more info)
# - `probe-rs` provides flashing and defmt via a hardware debugger, and stack unwind on panic
# - `rp2350tool` loads an elf, skipping unchanged flash sectors, verify it, and execute it
runner = "probe-rs run --chip RP235x --protocol swd"
#runner = "rp2350tool load -u -v -x -t elf"

# Linker flags are defined once in the workspace root `.cargo/config.toml`.

[build]
target = "thumbv8m.main-none-eabihf"

[env]
DEFMT_LOG = "debug"

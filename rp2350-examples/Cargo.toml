[package]
name = "rp2350-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Examples for rp2350"
repository.workspace = true
# Examples are never published to crates.io.
publish = false
autobins = false

# Shared helper code used by the example binaries (each `[[bin]]` is a
# separate crate, so common boilerplate lives in the lib target).
[lib]
name = "rp2350_examples"
path = "src/lib.rs"

[features]
# rp2350's defaults (`rp2350a`, defmt, critical-section-impl, panic-handler)
# are re-declared here so the chip variant can be switched without enabling
# two mutually-exclusive chip features at once.
default = ["defmt", "rp2350a", "critical-section-impl", "panic-handler"]
defmt = ["rp2350/defmt", "rp2350-drivers/defmt"]
# RP2350 chip variant selection (mutually exclusive). Forwarded to every
# dependency that itself depends on rp2350 so only one variant is enabled.
rp2350a = ["rp2350/rp2350a", "rp2350-drivers/rp2350a"]
rp2350b = ["rp2350/rp2350b", "rp2350-drivers/rp2350b"]
critical-section-impl = ["rp2350/critical-section-impl"]
panic-handler = ["rp2350/panic-handler"]
run-from-ram = ["rp2350/run-from-ram"]

[dependencies]
# The workspace-level `rp2350`/`rp2350-drivers` dependencies have
# `default-features = false`; the chip variant and other features are
# forwarded explicitly above.
rp2350.workspace = true
rp2350-drivers.workspace = true
rp2350-usb.workspace = true
rp2350-rt.workspace = true
defmt.workspace = true
defmt-rtt.workspace = true

